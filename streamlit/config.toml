# ui-kit Streamlit theme. Copy this file to your app as `.streamlit/config.toml`.
# Values map to semantic tokens in ui-kit.css (--jm-colour-*). See streamlit/README.md.

[theme]

# Chart series (matches --jm-colour-chart-1 … 5, light theme)
chartCategoricalColors = ["#a82848", "#9a4419", "#706c61", "#17623a", "#9e2222"]

[theme.light]
# --jm-colour-accent, --jm-colour-background, --jm-colour-surface, --jm-colour-text, --jm-colour-link
primaryColor = "#a82848"
backgroundColor = "#f8f4e3"
secondaryBackgroundColor = "#fdfbf5"
textColor = "#090909"
linkColor = "#a82848"
linkUnderline = false

[theme.light.sidebar]
backgroundColor = "#fdfbf5"
secondaryBackgroundColor = "#fbf8ee"
textColor = "#090909"

[theme.dark]
# Dark semantic tokens (magenta-bloom accent, graphite background, etc.)
primaryColor = "#e5446d"
backgroundColor = "#090909"
secondaryBackgroundColor = "#111211"
textColor = "#f8f4e3"
linkColor = "#ea6687"
linkUnderline = false
chartCategoricalColors = ["#ea6687", "#ff8966", "#a9a598", "#6cc08a", "#ee8a8a"]

[theme.dark.sidebar]
backgroundColor = "#111211"
secondaryBackgroundColor = "#1a1a1a"
textColor = "#f8f4e3"