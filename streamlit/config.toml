# ui-kit Streamlit theme. Copy this file to your app as `.streamlit/config.toml`.
# Values map to semantic tokens in ui-kit.css (--jm-colour-*). See streamlit/README.md.

[theme]

# Chart series (matches --jm-colour-chart-1 … 5, light theme)
chartCategoricalColors = ["#444554", "#704b29", "#4c4a4f", "#17623a", "#9e2222"]

[theme.light]
# --jm-colour-accent, --jm-colour-background, --jm-colour-surface, --jm-colour-text, --jm-colour-link
primaryColor = "#444554"
backgroundColor = "#e5d0cc"
secondaryBackgroundColor = "#f8efed"
textColor = "#172121"
linkColor = "#444554"
linkUnderline = false

[theme.light.sidebar]
backgroundColor = "#f8efed"
secondaryBackgroundColor = "#f2e5e2"
textColor = "#172121"

[theme.dark]
# Dark semantic tokens (lilac-ash accent, carbon-black background, etc.)
primaryColor = "#bfacb5"
backgroundColor = "#172121"
secondaryBackgroundColor = "#111818"
textColor = "#e5d0cc"
linkColor = "#ebdad7"
linkUnderline = false
chartCategoricalColors = ["#bfacb5", "#f5e8d9", "#949097", "#6cc08a", "#ee8a8a"]

[theme.dark.sidebar]
backgroundColor = "#111818"
secondaryBackgroundColor = "#0b1010"
textColor = "#e5d0cc"