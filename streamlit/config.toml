# ui-kit Streamlit theme. Copy this file to your app as `.streamlit/config.toml`.
# Values map to semantic tokens in ui-kit.css (--jm-colour-*). See streamlit/README.md.

[theme]

# Streamlit ships Source Sans and Source Serif, the same faces as ui-kit.css.
# headingFont needs Streamlit 1.45 or later.
font = "sans-serif"
headingFont = "serif"

# Chart series (matches --jm-colour-chart-1 … 5, light theme)
chartCategoricalColors = ["#1f5296", "#9a5b00", "#6a3d9a", "#17623a", "#9e2222"]

[theme.light]
# --jm-colour-accent, --jm-colour-background, --jm-colour-surface, --jm-colour-text, --jm-colour-link
primaryColor = "#2b67b5"
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#17191c"
linkColor = "#2b67b5"
linkUnderline = false

[theme.light.sidebar]
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#eaecef"
textColor = "#17191c"

[theme.dark]
# Dark semantic tokens (--jm-blue-300 accent, grey-900 background, etc.)
primaryColor = "#7fa8dd"
backgroundColor = "#17191c"
secondaryBackgroundColor = "#24282d"
textColor = "#f5f6f8"
linkColor = "#7fa8dd"
linkUnderline = false
chartCategoricalColors = ["#7fa8dd", "#f0b44c", "#c3a6e6", "#6cc08a", "#ee8a8a"]

[theme.dark.sidebar]
backgroundColor = "#24282d"
secondaryBackgroundColor = "#0e1012"
textColor = "#f5f6f8"